server {
  listen 80;
  server_name meet.seu-dominio.gov.br;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name meet.seu-dominio.gov.br;

  # Gerencie estes certificados por Certbot ou pelo proxy de borda.
  ssl_certificate /etc/letsencrypt/live/meet.seu-dominio.gov.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/meet.seu-dominio.gov.br/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
  }
}
